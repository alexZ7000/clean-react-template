name: CI

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22.17.0"

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: "1.4.2"

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Run linter
              run: bun run lint

            - name: Run tests
              run: bun run test

            - name: Build project
              run: bun run build
